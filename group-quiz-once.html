<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#181d2a;color:white;font-family:Tahoma,Arial;text-align:center}header{background:#a32135;padding:20px;border-bottom:5px solid #d7ad59}main{max-width:800px;margin:25px auto;padding:15px}.card{background:#252e40;border:1px solid #bd9854;border-radius:20px;padding:25px;margin:12px 0}.word{font-size:clamp(36px,8vw,65px);color:#f3ca78;margin:25px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{background:#2858a1;color:white;border:0;border-radius:12px;padding:18px 8px;min-height:75px;font-size:17px}.answers button:nth-child(2){background:#9c5928}.answers button:nth-child(3){background:#7452a6}.answers button:nth-child(4){background:#187d85}button{cursor:pointer}.action{background:#d7ad59;color:#201b17;border:0;border-radius:12px;padding:15px 24px;font-weight:bold;font-size:17px;margin:8px}input{padding:15px;border-radius:10px;border:1px solid #ccc;font-size:18px;width:100%;max-width:330px}#timer,#status{color:#f3ca78;min-height:30px}#timer{font-size:27px;font-weight:bold}button:disabled{opacity:.5}[hidden]{display:none!important}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 4px;border-bottom:1px solid #4a5260}small{color:#d8d8d8}</style></head><body><header><h1>🇴🇲 تحدّي اللهجة العُمانية 🇴🇲</h1><p>علوم الأولين | من يعرف معنى الكلمة؟</p></header><main><section class="card" id="waiting"><h2>⏳ المسابقة مقفلة حاليًا</h2><p>انتظروا المنظّمة تفتح التحدّي.</p><button class="action" id="refresh">تحديث الحالة</button><p id="status"></p></section><section class="card" id="start" hidden><h2>أهلًا بك في التحدّي!</h2><p>اكتب اسمك للمشاركة</p><input id="player" maxlength="35" placeholder="اسم المشارك"><p><button class="action" id="startBtn">ابدأ التحدّي</button></p><p id="startMsg"></p></section><section class="card" id="game" hidden><p id="progress"></p><div id="timer"></div><div class="word" id="word"></div><div class="answers" id="answers"></div><p id="score"></p></section><section class="card" id="finish" hidden><h2>🏆 انتهى التحدّي</h2><p id="result"></p><p id="saveStatus"></p></section><p><small>نسخة تجريبية: النتائج قابلة للتلاعب تقنيًا إلى أن تُعتمد آلية تحقق خادمية.</small></p></main><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,updateDoc,serverTimestamp,collection,getDocs,onSnapshot} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyCAKaDzLxGz7s6CVcpM2lkdmQ0HM1_5uI0',authDomain:'omani-quiz-2026.firebaseapp.com',projectId:'omani-quiz-2026',storageBucket:'omani-quiz-2026.firebasestorage.app',messagingSenderId:'33365744481',appId:'1:33365744481:web:ba30017418e073e772c320'});const auth=getAuth(app),db=getFirestore(app);
const questions=[["مسيفياه", ["حشرة تصيب الليمون", "أم أربعة وأربعين", "صغيرة الماعز", "نوع من أواني المطبخ"], 1], ["كعل", ["حشرة تصيب النخيل", "سطل", "نوع من الحلي", "القمر"], 0], ["فرجولة", ["صغيرة الماعز", "حشرة ليلية", "صغيرة الدجاجة", "أداة للحشائش"], 2], ["قنزوز", ["طائر مهاجر", "حشرة تصدر صوتًا في السمر", "حلية للقدم", "وعاء للماء"], 1], ["مجز", ["أداة للحشائش", "سطل", "إناء للطبخ", "قطعة من الزي العماني"], 0], ["صخيلة", ["صغيرة الدجاجة", "نوع من النخيل", "صغيرة الماعز", "أداة زراعية"], 2], ["غذفه", ["حشرة تصيب النخيل", "من الزي العماني", "أداة زراعية", "نوع من الأواني"], 1], ["سحل", ["حلية للمرأة", "حشرة تصيب الليمون", "صغيرة الدجاجة", "القمر"], 1], ["سجرجه", ["من أواني المطبخ", "حشرة ليلية", "سطل", "نوع من الملابس"], 0], ["الدهديه", ["بهدوء", "في المساء", "بسرعة", "من بعيد"], 2], ["الدهيد", ["الشمس", "النجم", "البرق", "القمر"], 3], ["لجن", ["قطعة قماش", "سطل", "حشرة", "أداة للحشائش"], 1], ["مبدع", ["صغير الفقير", "سطل", "نوع من الحلي", "نوع من الطيور"], 0], ["نطل", ["حلية تلبسها المرأة في القدم", "أداة للحشائش", "وعاء للماء", "حشرة تصيب النخيل"], 0]];
const el=id=>document.getElementById(id);
const attemptKey='omani-quiz-2026-attempt-v1';
function blockedAttempt(){
  const state=localStorage.getItem(attemptKey);
  if(state){
    el('waiting').hidden=true;el('start').hidden=true;el('game').hidden=true;
    el('finish').hidden=false;
    el('result').textContent=state==='done'?'سبق وشاركت في المسابقة. شكرًا لمشاركتك!':'سبق وبدأت محاولة على هذا المتصفح، ولا يمكن إعادتها.';
    el('saveStatus').textContent='لكل مشارك محاولة واحدة على هذا المتصفح.';
    return true;
  }
  return false;
}
let user=null,name='',index=0,score=0,startedAt=0,locked=false,ticker=null,deadline=0,started=false,finished=false;
async function checkOpen(){if(blockedAttempt())return false;try{const s=await getDoc(doc(db,'settings','competition'));const open=s.exists()&&s.data().isOpen===true;el('waiting').hidden=open;el('start').hidden=!open;if(!open)el('status').textContent='المسابقة لم تُفتح بعد';return open}catch(e){el('status').textContent='تعذر قراءة حالة المسابقة: '+e.code;return false}}
el('refresh').onclick=checkOpen;blockedAttempt()||checkOpen();
el('startBtn').onclick=async()=>{if(started||blockedAttempt())return;name=el('player').value.trim();if(name.length<2){el('startMsg').textContent='اكتب اسمًا من حرفين على الأقل';return}el('startBtn').disabled=true;el('startMsg').textContent='جارٍ تجهيز المشاركة...';try{if(!await checkOpen())throw Error('المسابقة مقفلة');const c=await signInAnonymously(auth);user=c.user;if(blockedAttempt())return;localStorage.setItem(attemptKey,'started');started=true;startedAt=Date.now();el('waiting').hidden=true;el('start').hidden=true;el('game').hidden=false;show()}catch(e){el('startMsg').textContent='تعذر البدء: '+(e.code||e.message);el('startBtn').disabled=false}};
function show(){locked=false;const q=questions[index];el('progress').textContent=`السؤال ${index+1} من ${questions.length}`;el('word').textContent=q[0];el('score').textContent=`النقاط: ${score}`;const box=el('answers');box.replaceChildren();q[1].forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(i);box.appendChild(b)});deadline=Date.now()+20000;clearInterval(ticker);const tick=()=>{if(locked)return;const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));el('timer').textContent=`⏱️ ${left} ثانية`;if(left===0)answer(null)};tick();ticker=setInterval(tick,150)}
function answer(i){if(locked||Date.now()>deadline+150)return;locked=true;clearInterval(ticker);if(i===questions[index][2]&&Date.now()<=deadline)score+=1000;index++;if(index<questions.length)show();else finish()}
async function finish(){if(finished)return;finished=true;localStorage.setItem(attemptKey,'done');clearInterval(ticker);el('game').hidden=true;el('finish').hidden=false;const seconds=Math.round((Date.now()-startedAt)/1000);el('result').textContent=`${name} — ${score} من 14000 نقطة | ${seconds} ثانية`;el('saveStatus').textContent='جارٍ إرسال النتيجة...';try{await setDoc(doc(db,'results',user.uid),{name,score,seconds,completedAt:serverTimestamp(),uid:user.uid});el('saveStatus').textContent='✅ تم إرسال النتيجة'}catch(e){el('saveStatus').textContent='⚠️ لم تُحفظ النتيجة: '+(e.code||e.message)}}
</script></body></html>
