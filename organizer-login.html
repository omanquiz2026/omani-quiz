<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول منظّمة التحدّي</title><style>body{font-family:Tahoma,Arial;background:#181d2a;color:white;text-align:center;margin:0}header{background:#982b39;padding:25px}main{max-width:540px;margin:45px auto;padding:25px;background:#252e40;border:1px solid #d7ad59;border-radius:18px}button{padding:15px 24px;border:0;border-radius:12px;background:#d7ad59;font-size:18px;font-weight:bold}#status{line-height:2;overflow-wrap:anywhere}</style></head><body><header><h1>🇴🇲 تحدّي اللهجة العُمانية</h1></header><main><h2>🔐 دخول المنظّمة</h2><p>الدخول مخصّص لحساب المنظّمة المعتمد فقط.</p><button id="login">تسجيل الدخول بحساب Google</button><p id="status">هذه صفحة تسجيل الدخول فقط. لوحة التحكم لم تُفعّل بعد.</p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
const config={apiKey:'AIzaSyCAKaDzLxGz7s6CVcpM2lkdmQ0HM1_5uI0',authDomain:'omani-quiz-2026.firebaseapp.com',projectId:'omani-quiz-2026',storageBucket:'omani-quiz-2026.firebasestorage.app',messagingSenderId:'33365744481',appId:'1:33365744481:web:ba30017418e073e772c320'};
const auth=getAuth(initializeApp(config));const allowed='bushra9693@gmail.com';const status=document.getElementById('status');const button=document.getElementById('login');
async function verify(u){if(!u)return; if(u.email?.toLowerCase()!==allowed || !u.emailVerified){await signOut(auth);status.textContent='هذا الحساب غير مصرح له بدخول لوحة المنظّمة.';return;}status.textContent='✅ تم تسجيل دخول المنظّمة بنجاح. لوحة التحكم والصلاحيات قيد التجهيز؛ لا يمكن فتح المسابقة أو قراءة النتائج من هذه الصفحة بعد.';button.hidden=true;}
onAuthStateChanged(auth,u=>{verify(u).catch(e=>status.textContent='تعذر التحقق من الحساب: '+e.code)});
getRedirectResult(auth).catch(e=>status.textContent='تعذر تسجيل الدخول: '+e.code);
button.onclick=async()=>{button.disabled=true;status.textContent='جارٍ تسجيل الدخول...';try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code==='auth/popup-blocked'){try{await signInWithRedirect(auth,new GoogleAuthProvider());return}catch(e2){status.textContent='تعذر تسجيل الدخول: '+e2.code}}else status.textContent='تعذر تسجيل الدخول: '+e.code}finally{button.disabled=false}};
</script></body></html>
