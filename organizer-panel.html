<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#181d2a;color:white;font-family:Tahoma,Arial;text-align:center}header{background:#a32135;padding:20px;border-bottom:5px solid #d7ad59}main{max-width:800px;margin:25px auto;padding:15px}.card{background:#252e40;border:1px solid #bd9854;border-radius:20px;padding:25px;margin:12px 0}.word{font-size:clamp(36px,8vw,65px);color:#f3ca78;margin:25px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{background:#2858a1;color:white;border:0;border-radius:12px;padding:18px 8px;min-height:75px;font-size:17px}.answers button:nth-child(2){background:#9c5928}.answers button:nth-child(3){background:#7452a6}.answers button:nth-child(4){background:#187d85}button{cursor:pointer}.action{background:#d7ad59;color:#201b17;border:0;border-radius:12px;padding:15px 24px;font-weight:bold;font-size:17px;margin:8px}input{padding:15px;border-radius:10px;border:1px solid #ccc;font-size:18px;width:100%;max-width:330px}#timer,#status{color:#f3ca78;min-height:30px}#timer{font-size:27px;font-weight:bold}button:disabled{opacity:.5}[hidden]{display:none!important}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 4px;border-bottom:1px solid #4a5260}small{color:#d8d8d8}</style></head><body><header><h1>🇴🇲 تحدّي اللهجة العُمانية 🇴🇲</h1><p>علوم الأولين | من يعرف معنى الكلمة؟</p></header><main><section class="card"><h2>🔐 لوحة المنظّمة</h2><button class="action" id="login">تسجيل الدخول بحساب Google</button><button class="action" id="logout" hidden>تسجيل الخروج</button><p id="status">الدخول مخصّص للمنظّمة فقط.</p></section><section class="card" id="panel" hidden><h2>التحكم بالمسابقة</h2><p id="state"></p><button class="action" id="open">🟢 فتح المسابقة</button><button class="action" id="close">🔴 إغلاق المسابقة</button><p>ملاحظة: الإغلاق يمنع بدء مشاركة جديدة وحفظ نتائج جديدة؛ المشاركون الذين بدأوا قبل الإغلاق قد لا تُحفظ نتائجهم.</p></section><section class="card" id="results" hidden><h2>🏆 نتائج جميع المشاركين</h2><button class="action" id="reload">تحديث النتائج</button><p id="count"></p><div style="overflow-x:auto"><table><thead><tr><th>الترتيب</th><th>الاسم</th><th>النقاط</th><th>الثواني</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,updateDoc,serverTimestamp,collection,getDocs,onSnapshot} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyCAKaDzLxGz7s6CVcpM2lkdmQ0HM1_5uI0',authDomain:'omani-quiz-2026.firebaseapp.com',projectId:'omani-quiz-2026',storageBucket:'omani-quiz-2026.firebasestorage.app',messagingSenderId:'33365744481',appId:'1:33365744481:web:ba30017418e073e772c320'});const auth=getAuth(app),db=getFirestore(app);

const allowed='bushra9693@gmail.com',el=id=>document.getElementById(id);let authorized=false;
const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
async function verify(u){authorized=!!(u&&u.email?.toLowerCase()===allowed&&u.emailVerified);el('panel').hidden=!authorized;el('results').hidden=!authorized;el('login').hidden=authorized;el('logout').hidden=!u;if(!u){el('status').textContent='سجّلي الدخول بحساب المنظّمة.';return}if(!authorized){el('status').textContent='هذا الحساب ليس حساب المنظّمة المعتمد.';return}el('status').textContent='✅ تم تسجيل دخول المنظّمة';await refresh();await loadResults()}
onAuthStateChanged(auth,u=>{verify(u).catch(e=>el('status').textContent='خطأ: '+(e.code||e.message))});getRedirectResult(auth).catch(e=>el('status').textContent='تعذر تسجيل الدخول: '+e.code);
el('login').onclick=async()=>{el('status').textContent='جارٍ تسجيل الدخول...';try{await signInWithPopup(auth,provider)}catch(e){if(e.code==='auth/popup-blocked'){try{await signInWithRedirect(auth,provider)}catch(x){el('status').textContent='خطأ: '+x.code}}else el('status').textContent='خطأ: '+e.code}};
el('logout').onclick=()=>signOut(auth);
async function refresh(){if(!authorized)return;const s=await getDoc(doc(db,'settings','competition'));el('state').textContent=s.exists()&&s.data().isOpen?'🟢 المسابقة مفتوحة':'🔴 المسابقة مقفلة'}
async function setOpen(value){if(!authorized)return;const b=el(value?'open':'close');b.disabled=true;try{await updateDoc(doc(db,'settings','competition'),{isOpen:value});await refresh()}catch(e){el('status').textContent='تعذر تغيير الحالة: '+e.code}finally{b.disabled=false}}
el('open').onclick=()=>setOpen(true);el('close').onclick=()=>setOpen(false);
async function loadResults(){if(!authorized)return;try{const snap=await getDocs(collection(db,'results'));const a=snap.docs.map(d=>d.data()).filter(x=>Number.isInteger(x.score)&&Number.isInteger(x.seconds)).sort((a,b)=>b.score-a.score||a.seconds-b.seconds);el('count').textContent=`عدد النتائج: ${a.length} | الثلاثة الأوائل 🏆`;el('rows').replaceChildren();a.forEach((r,i)=>{const tr=document.createElement('tr');[String(i+1)+(i<3?' 🏆':''),String(r.name||''),String(r.score),String(r.seconds)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});el('rows').appendChild(tr)})}catch(e){el('count').textContent='تعذر قراءة النتائج: '+e.code}}
el('reload').onclick=loadResults;
</script></body></html>
