<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة المنظّمة | تحدي اللهجة العمانية</title><style>*{box-sizing:border-box}body{margin:0;background:#181d2a;color:white;font-family:Tahoma,Arial;text-align:center}header{background:#a32135;padding:18px;border-bottom:4px solid #d7ad59}main{max-width:760px;margin:22px auto;padding:14px}.card{background:#252e40;border:1px solid #bd9854;border-radius:18px;padding:22px}.word{font-size:clamp(35px,8vw,60px);color:#f3ca78;margin:20px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{background:#2858a1;color:white;border:0;border-radius:12px;padding:17px 8px;min-height:70px;font-size:17px}.answers button:nth-child(2){background:#9c5928}.answers button:nth-child(3){background:#7452a6}.answers button:nth-child(4){background:#187d85}.action{background:#d7ad59;color:#201b17;border:0;border-radius:12px;padding:14px 22px;font-weight:bold;font-size:18px;margin:10px}#timer{font-size:26px;color:#f3ca78;font-weight:bold}[hidden]{display:none!important}small{color:#ddd}</style></head><body><header><h1>🇴🇲 تحدّي اللهجة العُمانية 🇴🇲</h1><p>نسخة تجربة خاصة للمنظّمة</p></header><main><section class="card" id="start"><h2>تجربة الأسئلة بدون تسجيل</h2><p>14 سؤالًا • 20 ثانية لكل سؤال • لا تُحفظ النتائج</p><button class="action" id="begin">ابدئي التجربة</button></section><section class="card" id="game" hidden><p id="progress"></p><div id="timer"></div><div class="word" id="word"></div><div class="answers" id="answers"></div><p id="score"></p></section><section class="card" id="finish" hidden><h2>🏆 انتهت التجربة</h2><p id="result"></p><p>هذه النتيجة للتجربة فقط ولم تُرسل لأي مكان.</p><button class="action" id="again">إعادة التجربة</button></section><p><small>هذه الصفحة مستقلة تمامًا: لا تتصل بـ Firebase ولا تسجل أي مشاركة رسمية.</small></p></main><script>const questions=[["مسيفياه", ["حشرة تصيب الليمون", "أم أربعة وأربعين", "صغيرة الماعز", "نوع من أواني المطبخ"], 1], ["كعل", ["حشرة تصيب النخيل", "سطل", "نوع من الحلي", "القمر"], 0], ["فرجولة", ["صغيرة الماعز", "حشرة ليلية", "صغيرة الدجاجة", "أداة للحشائش"], 2], ["فنزوز", ["طائر مهاجر", "حشرة تصدر صوتًا في السمر", "حلية للقدم", "وعاء للماء"], 1], ["مجز", ["أداة للحشائش", "سطل", "إناء للطبخ", "قطعة من الزي العماني"], 0], ["صخيلة", ["صغيرة الدجاجة", "نوع من النخيل", "صغيرة الماعز", "أداة زراعية"], 2], ["غدفه", ["حشرة تصيب النخيل", "من الزي العماني", "أداة زراعية", "نوع من الأواني"], 1], ["سحل", ["حلية للمرأة", "حشرة تصيب الليمون", "صغيرة الدجاجة", "القمر"], 1], ["سجرجه", ["من أواني المطبخ", "حشرة ليلية", "سطل", "نوع من الملابس"], 0], ["الدهديه", ["بهدوء", "في المساء", "بسرعة", "من بعيد"], 2], ["الدهيد", ["الشمس", "النجم", "البرق", "القمر"], 3], ["لجن", ["قطعة قماش", "سطل", "حشرة", "أداة للحشائش"], 1], ["مبدع", ["صغير القفير", "سطل", "نوع من الحلي", "نوع من الطيور"], 0], ["نطل", ["حلية تلبسها المرأة في القدم", "أداة للحشائش", "وعاء للماء", "حشرة تصيب النخيل"], 0]];const el=id=>document.getElementById(id);let index=0,score=0,startedAt=0,locked=false,deadline=0,ticker=null;function begin(){index=0;score=0;startedAt=Date.now();el('start').hidden=true;el('finish').hidden=true;el('game').hidden=false;show()}function show(){locked=false;const q=questions[index];el('progress').textContent=`السؤال ${index+1} من ${questions.length}`;el('word').textContent=q[0];el('score').textContent=`النقاط: ${score}`;const box=el('answers');box.replaceChildren();q[1].forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(i);box.appendChild(b)});deadline=Date.now()+20000;clearInterval(ticker);function tick(){if(locked)return;const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));el('timer').textContent=`⏱️ ${left} ثانية`;if(left===0)answer(null)}tick();ticker=setInterval(tick,150)}function answer(i){if(locked)return;locked=true;clearInterval(ticker);if(i!==null&&i===questions[index][2]&&Date.now()<=deadline)score+=1000;index++;if(index<questions.length)show();else finish()}function finish(){clearInterval(ticker);el('game').hidden=true;el('finish').hidden=false;el('result').textContent=`${score} من 14000 نقطة | ${Math.round((Date.now()-startedAt)/1000)} ثانية`}el('begin').onclick=begin;el('again').onclick=begin;</script></body></html>
